name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required repository Actions secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Android version from tag
        id: app-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a semantic version tag such as v1.2.3." >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 2147 || minor > 999 || patch > 999 )); then
            echo "Version components exceed the supported Android version-code range." >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "version_name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studora-upload-key.jks"
          test -s "$RUNNER_TEMP/studora-upload-key.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/studora-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.app-version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
        run: ./gradlew --no-daemon -PstudoraVersionName="$APP_VERSION_NAME" -PstudoraVersionCode="$APP_VERSION_CODE" assembleRelease

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION_NAME: ${{ steps.app-version.outputs.version_name }}
        run: |
          release_apk="$RUNNER_TEMP/Studora-${APP_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$release_apk"
          gh release create "$GITHUB_REF_NAME" "$release_apk" --title "Studora $GITHUB_REF_NAME" --generate-notes
